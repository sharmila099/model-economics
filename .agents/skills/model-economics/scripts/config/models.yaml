models:
  - id: gemini-2.0-flash
    provider: google
    display_name: "Gemini 2.0 Flash"
    model_name: "gemini-2.0-flash"
    input_cost_per_1m: 0.10       # USD per 1M input tokens
    output_cost_per_1m: 0.40      # USD per 1M output tokens
    max_output_tokens: 8192
    supports_streaming: true
    enabled: true

  - id: gemini-2.5-pro
    provider: google
    display_name: "Gemini 2.5 Pro"
    model_name: "gemini-2.5-pro"
    input_cost_per_1m: 1.25       # ≤200k tokens tier
    output_cost_per_1m: 10.00
    max_output_tokens: 8192
    supports_streaming: true
    enabled: true

  - id: gpt-4o
    provider: openai
    display_name: "GPT-4o"
    model_name: "gpt-4o"
    input_cost_per_1m: 2.50
    output_cost_per_1m: 10.00
    max_output_tokens: 4096
    supports_streaming: true
    enabled: true

  - id: gpt-4o-mini
    provider: openai
    display_name: "GPT-4o Mini"
    model_name: "gpt-4o-mini"
    input_cost_per_1m: 0.15
    output_cost_per_1m: 0.60
    max_output_tokens: 4096
    supports_streaming: true
    enabled: true

  - id: claude-sonnet-4-5
    provider: anthropic
    display_name: "Claude Sonnet 4.5"
    model_name: "claude-sonnet-4-5"
    input_cost_per_1m: 3.00
    output_cost_per_1m: 15.00
    max_output_tokens: 4096
    supports_streaming: true
    enabled: true

  - id: claude-haiku-3-5
    provider: anthropic
    display_name: "Claude Haiku 3.5"
    model_name: "claude-haiku-3-5"
    input_cost_per_1m: 0.80
    output_cost_per_1m: 4.00
    max_output_tokens: 4096
    supports_streaming: true
    enabled: true

# Model used as the LLM-as-a-Judge for quality scoring.
# Must be a cheap, fast model. Do NOT use one of the models being benchmarked.
judge_model:
  provider: google
  model_name: "gemini-2.0-flash"
  display_name: "Gemini 2.0 Flash (Judge)"
